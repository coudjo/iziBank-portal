server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # The app shell: always revalidated, so staff get a new release on their next page load.
  location = /index.html {
    include /etc/nginx/snippets/security-headers.inc;
    add_header Cache-Control "no-cache" always;
  }

  # Runtime settings: never cached, never rendered.
  location = /config.json {
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  # Hashed build output (outputHashing: all): safe to cache for a year.
  location ~* "^/(chunk|main|polyfills|styles)-[A-Za-z0-9_-]+\.(js|css)$" {
    include /etc/nginx/snippets/security-headers.inc;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # Fonts emitted by the build carry a content hash in their names too.
  location ^~ /media/ {
    include /etc/nginx/snippets/security-headers.inc;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location /api/ {
    include /etc/nginx/snippets/security-headers.inc;
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 8m;
  }

  location / {
    include /etc/nginx/snippets/security-headers.inc;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
